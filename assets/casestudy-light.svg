<svg xmlns="http://www.w3.org/2000/svg" width="340" height="40" viewBox="0 0 340 40" role="img" aria-label="See the rantai.dev case study →"><title>See the rantai.dev case study →</title><style>@font-face{font-family:Geist;font-weight:400 600;src:url(data:font/woff2;base64,) format("woff2")}
  text{font-family:Geist, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', system-ui, sans-serif;fill:#0a0a0a}
  .me text{fill:#fafafa}
  .a{opacity:0;transform-box:fill-box;transform-origin:0% 100%;animation:pop .55s cubic-bezier(0.22, 1, 0.36, 1) both}
  .me.a{transform-origin:100% 100%}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes hide{to{opacity:0;visibility:hidden}}
  .dots circle{fill:#a3a3a3;animation:dot 1s ease-in-out infinite;transform-box:fill-box}
  .dots circle:nth-child(2){animation-delay:.15s}.dots circle:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-3px);opacity:1}}
  @media (prefers-reduced-motion:reduce){.a{animation:none!important;opacity:1}.typing{display:none}}</style><g class="a" style="animation-delay:4.75s"><g transform="translate(52 0)"><rect x="0.5" y="0.5" width="287" height="39" rx="19.5" fill="none" stroke="#e5e5e5"/>
